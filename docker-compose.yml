services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '3306:3306'

  # S3-compatible object storage run locally from day one (plan §2, §10) so
  # StorageModule's S3 adapter is exercised now — moving to a real bucket
  # later is a STORAGE_S3_* env var change, not a code change.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      # Plain Node http request, not curl — the backend image is
      # node:20-slim with only chromium's own dependencies installed, no
      # curl/wget guaranteed present.
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    # Runs by default since this build's confirmed scope is simulated
    # sensors (no physical hardware integration). Once a real scale/camera
    # is wired up for a given facility, stop this service (or run
    # `docker compose stop simulator`) rather than deleting it — see
    # apps/simulator's device-source contract for why swapping is meant to
    # be a config change, not a rewrite.

  frontend:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  mysql_data:
  minio_data:
