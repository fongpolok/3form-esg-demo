# PoC-scale path-based routing (plan §10): no real domain/DNS decided yet,
# so both SPAs and the API share one origin instead of subdomains. Revisit
# as subdomain routing once a cloud provider + domain is chosen.
server {
  listen 80;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Deliberately outside /api/ (main.ts excludes it from the api/v1 prefix
  # too) — a cloud load balancer's health probe should not depend on the
  # API versioning prefix ever changing.
  location = /health {
    proxy_pass http://backend:3000/health;
  }

  location = / {
    return 302 /ops/;
  }

  location /ops/ {
    alias /usr/share/nginx/html/ops-portal/;
    try_files $uri $uri/ /ops/index.html;
  }

  location /client/ {
    alias /usr/share/nginx/html/client-portal/;
    try_files $uri $uri/ /client/index.html;
  }
}
