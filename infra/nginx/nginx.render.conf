# Same routing as ./nginx.conf, except proxy_pass targets the backend's
# public Render URL instead of the Docker-Compose-internal `backend:3000` —
# see Dockerfile.render's comment for why this is a separate file rather
# than templating the existing one.
server {
  listen 80;

  location /api/ {
    proxy_pass https://esg-backend-zua5.onrender.com/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass https://esg-backend-zua5.onrender.com/health;
  }

  location = / {
    return 302 /ops/;
  }

  location /ops/ {
    alias /usr/share/nginx/html/ops-portal/;
    try_files $uri $uri/ /ops/index.html;
  }

  location /client/ {
    alias /usr/share/nginx/html/client-portal/;
    try_files $uri $uri/ /client/index.html;
  }
}
